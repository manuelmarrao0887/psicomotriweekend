// ─── UTILS ───────────────────────────────────────────────────────────────────
const initials  = n => (n||"?").split(" ").map(x=>x[0]).join("").toUpperCase().slice(0,2);

const genCode   = () => Math.random().toString(36).slice(2,8).toUpperCase();

function getDays(s,e) {
  if(!s||!e) return [];
  const days=[];
  for(let d=new Date(s+"T00:00:00");d<=new Date(e+"T00:00:00");d.setDate(d.getDate()+1))
    days.push(new Date(d).toISOString().split("T")[0]);
  return days;
}
function fmtDate(ds) { if(!ds) return ""; return new Date(ds+"T00:00:00").toLocaleDateString("pt-PT",{weekday:"short",day:"numeric",month:"short"}); }

// ─── DEBT SIMPLIFICATION ─────────────────────────────────────────────────────
function simplify(expenses, people) {
  const bal = {}; people.forEach(p=>{bal[p.id]=0;});
  expenses.forEach(({amount,paid_by,split_with})=>{
    if(!split_with?.length) return;
    bal[paid_by]=(bal[paid_by]||0)+parseFloat(amount||0);
    const share=parseFloat(amount||0)/split_with.length;
    split_with.forEach(id=>{bal[id]=(bal[id]||0)-share;});
  });
  const cred=[],debt=[];
  Object.entries(bal).forEach(([id,b])=>{
    if(b>0.01) cred.push({id,a:b}); else if(b<-0.01) debt.push({id,a:-b});
  });
  cred.sort((a,b)=>b.a-a.a); debt.sort((a,b)=>b.a-a.a);
  const txns=[]; let i=0,j=0;
  while(i<cred.length&&j<debt.length){
    const amt=Math.min(cred[i].a,debt[j].a);
    if(amt>0.01) txns.push({from:debt[j].id,to:cred[i].id,amount:Math.round(amt*100)/100});
    cred[i].a-=amt; debt[j].a-=amt;
    if(cred[i].a<0.01)i++; if(debt[j].a<0.01)j++;
  }
  return {txns,bal};
}

function Chevron({down}){return(<svg width="10" height="6" viewBox="0 0 10 6" style={{transform:down?"rotate(180deg)":"none",transition:"0.2s ease"}}><path d="M1 1l4 4 4-4" stroke={C.tertiary} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" fill="none"/></svg>);}
function ChevronRight(){return(<svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke={C.tertiary} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>);}
function Separator({left=0}){return(<div style={{height:1,background:C.separator,marginLeft:left}}/>);}

function Input({label,value,onChange,type="text",placeholder,autoFocus}){
  return(<div style={{marginBottom:16}}>{label&&<div style={{fontSize:13,fontWeight:500,color:C.secondary,marginBottom:6}}>{label}</div>}<input autoFocus={autoFocus} type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"12px 14px",borderRadius:10,border:`1.5px solid ${C.separator}`,background:C.fill,fontSize:15,color:C.label,outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/></div>);
}
function Btn({label,onClick,variant="primary",small,disabled,full=true,loading}){
  const bg=disabled?C.fill:variant==="primary"?C.primary:variant==="danger"?C.danger:C.fill;
  const fg=disabled?C.tertiary:variant==="secondary"?C.label:"white";

}

function Empty({emoji,title,subtitle}){return(<div style={{textAlign:"center",padding:"60px 0",color:C.secondary}}><div style={{fontSize:44,marginBottom:12}}>{emoji}</div><div style={{fontSize:16,fontWeight:600,color:C.label}}>{title}</div>{subtitle&&<div style={{fontSize:14,marginTop:4}}>{subtitle}</div>}</div>);}
function Spinner(){return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,fontFamily:"-apple-system,sans-serif"}}><div style={{width:36,height:36,borderRadius:"50%",border:`3px solid ${C.fill}`,borderTopColor:C.primary,animation:"spin 0.8s linear infinite"}}/><style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style><div style={{fontSize:14,color:C.secondary}}>A carregar...</div></div>);}

  const del=async()=>{setBusy(true);await deletePerson(editId);setBusy(false);setModal(false);};

      <div style={{marginBottom:20}}>
        <div style={{fontSize:22,fontWeight:800}}>{days.length} Dias</div>
        {allRestrictions.length>0&&<div style={{marginTop:8,display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}><span style={{fontSize:12,color:C.secondary,fontWeight:500}}>⚠️ Atenção:</span>{allRestrictions.map(r=><Pill key={r} label={r} color={C.warning}/>)}</div>}
      </div>
      {days.map((date,idx)=>{
        const isOpen=expanded===date;
        const filled=MEAL_TYPES.filter(m=>getMeal(date,m.key)).length;
        return(<Card key={date} style={{marginBottom:10}}>
          <div onClick={()=>setExpanded(isOpen?null:date)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",cursor:"pointer"}}>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:C.label}}>Dia {idx+1} · {fmtDate(date)}</div>
              <div style={{fontSize:12,color:C.secondary,marginTop:3}}>{filled===4?<span style={{color:C.success}}>✓ Completo</span>:`${filled}/4 refeições planeadas`}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              {filled===4&&<div style={{width:8,height:8,borderRadius:"50%",background:C.success}}/>}
              <Chevron down={isOpen}/>
            </div>
          </div>
          {isOpen&&(
            <div style={{borderTop:`1px solid ${C.separator}`}}>
              {MEAL_TYPES.map((meal,i)=>{
                const val=getMeal(date,meal.key); const isEd=editing?.date===date&&editing?.key===meal.key;
                return(<div key={meal.key}>
                  <div style={{padding:"12px 16px",display:"flex",gap:12,alignItems:"flex-start"}}>
                    <span style={{fontSize:22,marginTop:1,flexShrink:0}}>{meal.emoji}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11,fontWeight:600,color:C.secondary,textTransform:"uppercase",letterSpacing:.5,marginBottom:5}}>{meal.label}</div>
                      {isEd?(
                        <div>
                          <textarea autoFocus value={txt} onChange={e=>setTxt(e.target.value)} rows={2} placeholder={`O que há ao ${meal.label.toLowerCase()}?`}
                            style={{width:"100%",padding:"8px 10px",borderRadius:8,border:`1.5px solid ${C.primary}`,background:C.fill,fontSize:14,outline:"none",resize:"none",fontFamily:"inherit",boxSizing:"border-box",color:C.label}}/>
                          <div style={{display:"flex",gap:8,marginTop:8}}>
                            <Btn small label="Guardar" onClick={async()=>{await saveMeal(date,meal.key,txt);setEditing(null);}} full={false}/>
                            <Btn small label="Cancelar" variant="secondary" onClick={()=>setEditing(null)} full={false}/>
                          </div>
                        </div>
                      ):(
                        <div onClick={()=>{setTxt(val);setEditing({date,key:meal.key});}} style={{fontSize:14,color:val?C.label:C.tertiary,cursor:"pointer",lineHeight:1.5,minHeight:20}}>
                          {val||`Adicionar ${meal.label.toLowerCase()}...`}
                        </div>
                      )}
                    </div>
                  </div>
                  {i<MEAL_TYPES.length-1&&<Separator left={50}/>}
                </div>);
              })}
            </div>
          )}
        </Card>);
      })}
    </div>
  );
}

// ─── TAB: DESPESAS ───────────────────────────────────────────────────────────
function DespesasTab({expenses,people,addExpense,deleteExpense}){
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({description:"",amount:"",paid_by:"",category:"supermercado",split_with:[]});
  const [busy,setBusy]=useState(false);
  const openAdd=()=>{setForm({description:"",amount:"",paid_by:people[0]?.id||"",category:"supermercado",split_with:people.map(p=>p.id)});setModal(true);};
  const save=async()=>{if(!form.description||!form.amount||!form.paid_by||!form.split_with.length)return;setBusy(true);await addExpense(form);setBusy(false);setModal(false);};
  const toggleP=id=>setForm(f=>({...f,split_with:f.split_with.includes(id)?f.split_with.filter(x=>x!==id):[...f.split_with,id]}));
  const total=expenses.reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const byCat=EXPENSE_CATS.map(c=>({...c,t:expenses.filter(e=>e.category===c.id).reduce((s,e)=>s+parseFloat(e.amount||0),0)})).filter(c=>c.t>0);
  return(
    <div style={{padding:"16px 16px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
        <div>
          <div style={{fontSize:30,fontWeight:800,color:C.label}}>{currency(total)}</div>
          <div style={{fontSize:13,color:C.secondary,marginTop:2}}>{expenses.length} despesa{expenses.length!==1?"s":""} registada{expenses.length!==1?"s":""}</div>
        </div>
        {people.length>0&&<button onClick={openAdd} style={{background:C.primary,color:"white",border:"none",borderRadius:50,width:34,height:34,fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>}
      </div>
      {byCat.length>0&&(<>
        <SecHeader title="Por categoria"/>
        <div style={{display:"flex",gap:8,marginBottom:20,overflowX:"auto",paddingBottom:4}}>

        </div>
      </>)}
      {expenses.length>0?(<>
        <SecHeader title="Histórico"/>
        <Card style={{marginBottom:20}}>
          {[...expenses].reverse().map((e,i,arr)=>{
            const payer=people.find(p=>p.id===e.paid_by); const cat=EXPENSE_CATS.find(c=>c.id===e.category);
            const share=e.split_with?.length?parseFloat(e.amount)/e.split_with.length:0;
            return(<div key={e.id}>
              <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px"}}>
                <div style={{width:42,height:42,borderRadius:11,background:C.fill,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{cat?.emoji||"💳"}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:15,fontWeight:600,color:C.label,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.description}</div>
                  <div style={{fontSize:12,color:C.secondary,marginTop:2}}>Pago por <span style={{fontWeight:600}}>{payer?.name||"?"}</span> · {e.split_with?.length||0} pessoas · {currency(share)}/pessoa</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:15,fontWeight:700,color:C.label}}>{currency(parseFloat(e.amount))}</div>
                  <button onClick={()=>deleteExpense(e.id)} style={{background:"none",border:"none",color:C.danger,fontSize:11,cursor:"pointer",padding:0,marginTop:2,fontFamily:"inherit"}}>remover</button>

              </div>
              {i<arr.length-1&&<Separator left={70}/>}

          <Input label="Valor (€)" type="number" value={form.amount} onChange={v=>setForm(f=>({...f,amount:v}))} placeholder="0.00"/>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:500,color:C.secondary,marginBottom:8}}>Categoria</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {EXPENSE_CATS.map(c=>(<button key={c.id} onClick={()=>setForm(f=>({...f,category:c.id}))} style={{padding:"6px 12px",borderRadius:100,border:`1px solid ${form.category===c.id?C.primary:C.separator}`,background:form.category===c.id?C.primaryBg:"transparent",color:form.category===c.id?C.primary:C.label,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{c.emoji} {c.label}</button>))}
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:500,color:C.secondary,marginBottom:8}}>Quem pagou?</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {people.map(p=>(<div key={p.id} onClick={()=>setForm(f=>({...f,paid_by:p.id}))} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,cursor:"pointer",border:`1.5px solid ${form.paid_by===p.id?C.primary:C.separator}`,background:form.paid_by===p.id?C.primaryBg:"transparent"}}><Avatar name={p.name} id={p.id} size={28}/><span style={{flex:1,fontSize:14,color:form.paid_by===p.id?C.primary:C.label,fontWeight:form.paid_by===p.id?700:400}}>{p.name}</span>{form.paid_by===p.id&&<span style={{fontSize:12,color:C.primary}}>✓</span>}</div>))}
            </div>
          </div>
          <div style={{marginBottom:22}}>
            <div style={{fontSize:13,fontWeight:500,color:C.secondary,marginBottom:8}}>Dividir entre ({form.split_with.length}/{people.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {people.map(p=>{
                const sel=form.split_with.includes(p.id);
                const share=form.amount&&form.split_with.length>0?parseFloat(form.amount)/form.split_with.length:0;
                return(<div key={p.id} onClick={()=>toggleP(p.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,cursor:"pointer",border:`1.5px solid ${sel?C.success:C.separator}`,background:sel?C.successBg:"transparent"}}><Avatar name={p.name} id={p.id} size={28}/><span style={{flex:1,fontSize:14,color:C.label}}>{p.name}</span>{sel&&form.amount&&<span style={{fontSize:13,fontWeight:600,color:C.success}}>{currency(share)}</span>}<div style={{width:20,height:20,borderRadius:"50%",border:`1.5px solid ${sel?C.success:C.separator}`,background:sel?C.success:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{sel&&<span style={{color:"white",fontSize:12,fontWeight:700}}>✓</span>}</div></div>);
              })}
            </div>
          </div>
          <Btn label="Adicionar Despesa" onClick={save} loading={busy} disabled={!form.description||!form.amount||!form.paid_by||!form.split_with.length}/>
        </Modal>
      )}
    </div>
  );
}

// ─── TAB: DIVISÃO ─────────────────────────────────────────────────────────────
function DivisaoTab({expenses,people}){
  const {txns,bal}=useMemo(()=>simplify(expenses,people),[expenses,people]);
  if(!people.length)return<Empty emoji="⚖️" title="Adiciona pessoas primeiro" subtitle="No separador Pessoas"/>;
  const totalSpent=expenses.reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const maxAbs=Math.max(...Object.values(bal).map(v=>Math.abs(v)),0.01);
  return(
    <div style={{padding:"16px 16px 0"}}>
      <div style={{marginBottom:22}}>
        <div style={{fontSize:22,fontWeight:800}}>Divisão de Custos</div>
        <div style={{fontSize:13,color:C.secondary,marginTop:2}}>Simplificado · {txns.length} transferência{txns.length!==1?"s":""} necessária{txns.length!==1?"s":""}</div>
      </div>
      <SecHeader title="Saldo por Pessoa"/>
      <Card style={{marginBottom:22}}>
        {people.map((p,i)=>{
          const b=bal[p.id]||0; const pos=b>=0; const pct=(Math.abs(b)/maxAbs)*100;
          return(<div key={p.id}>
            <div style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px"}}>
              <Avatar name={p.name} id={p.id}/>
              <div style={{flex:1}}>
                <div style={{fontSize:15,fontWeight:600,color:C.label}}>{p.name}</div>
                <div style={{marginTop:7,height:5,background:C.fill,borderRadius:100,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${pct}%`,background:Math.abs(b)<0.01?C.fill:pos?C.success:C.danger,borderRadius:100,transition:"width .4s"}}/>
                </div>
                <div style={{fontSize:11,color:C.secondary,marginTop:3}}>{Math.abs(b)<0.01?"Contas certas":pos?`A receber ${currency(b)}`:`A pagar ${currency(Math.abs(b))}`}</div>
              </div>
              <div style={{fontSize:16,fontWeight:800,color:Math.abs(b)<0.01?C.tertiary:pos?C.success:C.danger,minWidth:72,textAlign:"right"}}>{Math.abs(b)<0.01?"—":(pos?"+":"")+currency(b)}</div>
            </div>
            {i<people.length-1&&<Separator left={64}/>}
          </div>);
        })}
      </Card>
      <SecHeader title={`Transferências (${txns.length})`}/>
      {txns.length===0?(
        <Card style={{padding:"24px 16px",textAlign:"center",marginBottom:22}}>
          <div style={{fontSize:36,marginBottom:8}}>🎉</div>
          <div style={{fontSize:16,fontWeight:700,color:C.label}}>Tudo resolvido!</div>
          <div style={{fontSize:13,color:C.secondary,marginTop:4}}>Nenhuma dívida por liquidar</div>
        </Card>
      ):(
        <Card style={{marginBottom:22}}>
          {txns.map((t,i)=>{
            const from=people.find(p=>p.id===t.from); const to=people.find(p=>p.id===t.to);
            return(<div key={i}>
              <div style={{display:"flex",alignItems:"center",padding:"14px 16px",gap:10}}>
                <Avatar name={from?.name||"?"} id={t.from} size={34}/>
                <div style={{flex:1}}><div style={{fontSize:14,color:C.label,lineHeight:1.4}}><span style={{fontWeight:700}}>{from?.name}</span><span style={{color:C.secondary}}> deve pagar a </span><span style={{fontWeight:700}}>{to?.name}</span></div></div>
                <Avatar name={to?.name||"?"} id={t.to} size={34}/>
                <div style={{fontSize:17,fontWeight:800,color:C.primary,minWidth:72,textAlign:"right"}}>{currency(t.amount)}</div>
              </div>
              {i<txns.length-1&&<Separator/>}
            </div>);
          })}
        </Card>
      )}
      {expenses.length>0&&(<>
        <SecHeader title="Resumo Global"/>
        <Card style={{padding:"2px 16px",marginBottom:22}}>
          {[{l:"Total gasto",v:currency(totalSpent)},{l:"Por pessoa (média)",v:people.length?currency(totalSpent/people.length):"—"},{l:"Despesas",v:expenses.length},{l:"Transferências",v:`${txns.length} pagamento${txns.length!==1?"s":""}`}].map((r,i,arr)=>(
            <div key={r.l}>
              <div style={{display:"flex",justifyContent:"space-between",padding:"13px 0"}}><span style={{fontSize:15,color:C.label}}>{r.l}</span><span style={{fontSize:15,fontWeight:700,color:C.label}}>{r.v}</span></div>
              {i<arr.length-1&&<Separator/>}
            </div>
          ))}
        </Card>
      </>)}
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("loading");
  const [trip,setTripState]=useState(null);
  const [people,setPeople]=useState([]);
  const [meals,setMeals]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [tab,setTab]=useState("viagem");
  const tripTimer=useRef(null);

  useEffect(()=>{
    const saved=localStorage.getItem("ferias-trip-id");
    if(saved)loadTrip(saved); else setScreen("join");
  },[]);

  const loadTrip=async(id)=>{
    const [{data:t},{data:pp},{data:mm},{data:ee}]=await Promise.all([
      supabase.from("trips").select("*").eq("id",id).single(),
      supabase.from("people").select("*").eq("trip_id",id).order("created_at"),
      supabase.from("meals").select("*").eq("trip_id",id),
      supabase.from("expenses").select("*").eq("trip_id",id).order("created_at"),
    ]);
    if(!t){localStorage.removeItem("ferias-trip-id");setScreen("join");return;}
    setTripState(t);setPeople(pp||[]);setMeals(mm||[]);setExpenses(ee||[]);setScreen("app");
  };

  useEffect(()=>{
    if(!trip?.id)return;
    const ch=supabase.channel(`trip:${trip.id}`)
      .on("postgres_changes",{event:"*",schema:"public",table:"trips",filter:`id=eq.${trip.id}`},({new:d,eventType})=>{if(eventType!=="DELETE")setTripState(d);})
      .on("postgres_changes",{event:"*",schema:"public",table:"people",filter:`trip_id=eq.${trip.id}`},({new:d,old:o,eventType})=>{
        if(eventType==="INSERT")setPeople(p=>p.some(x=>x.id===d.id)?p:[...p,d]);
        else if(eventType==="UPDATE")setPeople(p=>p.map(x=>x.id===d.id?d:x));
        else if(eventType==="DELETE")setPeople(p=>p.filter(x=>x.id!==o.id));
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"meals",filter:`trip_id=eq.${trip.id}`},({new:d,old:o,eventType})=>{
        if(eventType==="INSERT")setMeals(p=>p.some(x=>x.id===d.id)?p:[...p,d]);
        else if(eventType==="UPDATE")setMeals(p=>p.map(x=>x.id===d.id?d:x));
        else if(eventType==="DELETE")setMeals(p=>p.filter(x=>x.id!==o.id));
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"expenses",filter:`trip_id=eq.${trip.id}`},({new:d,old:o,eventType})=>{
        if(eventType==="INSERT")setExpenses(p=>p.some(x=>x.id===d.id)?p:[...p,d]);
        else if(eventType==="UPDATE")setExpenses(p=>p.map(x=>x.id===d.id?d:x));
        else if(eventType==="DELETE")setExpenses(p=>p.filter(x=>x.id!==o.id));
      })
      .subscribe();
    return()=>supabase.removeChannel(ch);
  },[trip?.id]);

  const handleJoin=async(code)=>{const{data}=await supabase.from("trips").select("id").eq("share_code",code).single();if(!data)return false;localStorage.setItem("ferias-trip-id",data.id);await loadTrip(data.id);return true;};
  const handleCreate=async()=>{const{data}=await supabase.from("trips").insert({name:"As Nossas Férias",share_code:genCode()}).select().single();if(!data)return;localStorage.setItem("ferias-trip-id",data.id);await loadTrip(data.id);};
  const handleLeave=()=>{localStorage.removeItem("ferias-trip-id");setTripState(null);setPeople([]);setMeals([]);setExpenses([]);setScreen("join");};

  const setTrip=useCallback((updater)=>{
    setTripState(prev=>{
      const next=typeof updater==="function"?updater(prev):updater;
      if(tripTimer.current)clearTimeout(tripTimer.current);
      tripTimer.current=setTimeout(async()=>{await supabase.from("trips").update({name:next.name,location:next.location,start_date:next.start_date||null,end_date:next.end_date||null,budget:next.budget||null,notes:next.notes}).eq("id",next.id);},700);
      return next;
    });
  },[]);

  const addPerson=async(form)=>{const{data}=await supabase.from("people").insert({trip_id:trip.id,...form}).select().single();if(data)setPeople(p=>[...p,data]);};
  const updatePerson=async(id,form)=>{const{data}=await supabase.from("people").update(form).eq("id",id).select().single();if(data)setPeople(p=>p.map(x=>x.id===id?data:x));};
  const deletePerson=async(id)=>{await supabase.from("people").delete().eq("id",id);setPeople(p=>p.filter(x=>x.id!==id));};
  const saveMeal=async(date,key,value)=>{const existing=meals.find(m=>m.date===date);if(existing){const{data}=await supabase.from("meals").update({[key]:value}).eq("id",existing.id).select().single();if(data)setMeals(p=>p.map(m=>m.id===existing.id?data:m));}else{const{data}=await supabase.from("meals").insert({trip_id:trip.id,date,[key]:value}).select().single();if(data)setMeals(p=>[...p,data]);}};
  const addExpense=async(form)=>{const{data}=await supabase.from("expenses").insert({trip_id:trip.id,...form,date:new Date().toISOString().split("T")[0]}).select().single();if(data)setExpenses(p=>[...p,data]);};
  const deleteExpense=async(id)=>{await supabase.from("expenses").delete().eq("id",id);setExpenses(p=>p.filter(x=>x.id!==id));};

  if(screen==="loading")return<Spinner/>;
  if(screen==="join")return<JoinScreen onJoin={handleJoin} onCreate={handleCreate}/>;

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI',sans-serif",maxWidth:640,margin:"0 auto",position:"relative",paddingBottom:90}}>
      <div style={{background:"rgba(242,242,247,.88)",backdropFilter:"blur(20px)",borderBottom:`1px solid ${C.separator}`,padding:"48px 20px 12px",position:"sticky",top:0,zIndex:100}}>
        <div style={{fontSize:12,color:C.secondary,fontWeight:500,letterSpacing:.3}}>{trip.location||"Férias em Grupo"}</div>
        <div style={{fontSize:26,fontWeight:800,color:C.label,lineHeight:1.1,marginTop:1}}>{trip.name||"As Nossas Férias"}</div>
      </div>
      <div>
        {tab==="viagem"  &&<ViagemTab   trip={trip} setTrip={setTrip} people={people} expenses={expenses} onLeave={handleLeave}/>}
        {tab==="pessoas" &&<PessoasTab  people={people} addPerson={addPerson} updatePerson={updatePerson} deletePerson={deletePerson}/>}
        {tab==="menu"    &&<MenuTab     trip={trip} meals={meals} saveMeal={saveMeal} people={people}/>}
        {tab==="despesas"&&<DespesasTab expenses={expenses} people={people} addExpense={addExpense} deleteExpense={deleteExpense}/>}
        {tab==="divisao" &&<DivisaoTab  expenses={expenses} people={people}/>}
      </div>
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:640,background:"rgba(242,242,247,.92)",backdropFilter:"blur(20px)",borderTop:`1px solid ${C.separator}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom,0)",zIndex:200}}>
        {TABS.map(t=>{const active=tab===t.id;return(<button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"9px 0 11px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>{TAB_ICONS[t.id](active)}<span style={{fontSize:10,fontWeight:600,color:active?C.primary:C.tertiary,letterSpacing:.2}}>{t.label}</span></button>);})}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
