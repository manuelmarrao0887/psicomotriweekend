function getDays(s,e){
  if(!s||!e)return[];
  const days=[];
  for(let d=new Date(s+"T00:00:00");d<=new Date(e+"T00:00:00");d.setDate(d.getDate()+1))
    days.push(new Date(d).toISOString().split("T")[0]);
  return days;
}
function fmtDate(ds){if(!ds)return"";return new Date(ds+"T00:00:00").toLocaleDateString("pt-PT",{weekday:"short",day:"numeric",month:"short"});}

// ─── DEBT SIMPLIFICATION ─────────────────────────────────────────────────────
function simplify(exps, ppl){
  const bal={};ppl.forEach(p=>{bal[p.id]=0;});
  exps.forEach(({amount,paidBy,splitWith})=>{
    if(!splitWith?.length)return;
    bal[paidBy]=(bal[paidBy]||0)+parseFloat(amount||0);
    const share=parseFloat(amount||0)/splitWith.length;
    splitWith.forEach(id=>{bal[id]=(bal[id]||0)-share;});
  });
  const cred=[],debt=[];
  Object.entries(bal).forEach(([id,b])=>{if(b>0.01)cred.push({id,a:b});else if(b<-0.01)debt.push({id,a:-b});});
  cred.sort((a,b)=>b.a-a.a);debt.sort((a,b)=>b.a-a.a);
  const txns=[];let i=0,j=0;
  while(i<cred.length&&j<debt.length){
    const amt=Math.min(cred[i].a,debt[j].a);
    if(amt>0.01)txns.push({from:debt[j].id,to:cred[i].id,amount:Math.round(amt*100)/100});
    cred[i].a-=amt;debt[j].a-=amt;
    if(cred[i].a<0.01)i++;if(debt[j].a<0.01)j++;
  }
  return{txns,bal};
}

function MenuTab({trip,mealsList,people}){
  const days=getDays(trip.startDate,trip.endDate);
  const [expanded,setExpanded]=useState(null);const [editing,setEditing]=useState(null);const [txt,setTxt]=useState("");
  const getMeal=(date,key)=>(mealsList.find(m=>m.id===date)||{})[key]||"";
  const saveMeal=async(date,key,val)=>{await db.collection("trips").doc(trip.id).collection("meals").doc(date).set({[key]:val},{merge:true});setEditing(null);};
  const allRestrictions=[...new Set(people.flatMap(p=>p.dietary||[]))];
  if(!days.length)return<Empty emoji="📅" title="Datas não definidas" subtitle="Define as datas no separador Viagem"/>;
  return(
    <div style={{padding:"16px 16px 0"}}>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:22,fontWeight:800}}>{days.length} Dias</div>
        {allRestrictions.length>0&&<div style={{marginTop:8,display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}><span style={{fontSize:12,color:C.secondary,fontWeight:500}}>⚠️ Atenção:</span>{allRestrictions.map(r=><Pill key={r} label={r} color={C.warning}/>)}</div>}
      </div>
      {days.map((date,idx)=>{
        const isOpen=expanded===date;const filled=MEAL_TYPES.filter(m=>getMeal(date,m.key)).length;
        return<Card key={date} style={{marginBottom:10}}>
          <div onClick={()=>setExpanded(isOpen?null:date)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",cursor:"pointer"}}>
            <div><div style={{fontSize:15,fontWeight:700,color:C.label}}>Dia {idx+1} · {fmtDate(date)}</div><div style={{fontSize:12,color:C.secondary,marginTop:3}}>{filled===4?<span style={{color:C.success}}>✓ Completo</span>:`${filled}/4 refeições planeadas`}</div></div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>{filled===4&&<div style={{width:8,height:8,borderRadius:"50%",background:C.success}}/>}<Chevron down={isOpen}/></div>
          </div>
          {isOpen&&<div style={{borderTop:`1px solid ${C.separator}`}}>
            {MEAL_TYPES.map((meal,i)=>{
              const val=getMeal(date,meal.key);const isEd=editing?.date===date&&editing?.key===meal.key;
              return<div key={meal.key}>
                <div style={{padding:"12px 16px",display:"flex",gap:12,alignItems:"flex-start"}}>
                  <span style={{fontSize:22,marginTop:1,flexShrink:0}}>{meal.emoji}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:11,fontWeight:600,color:C.secondary,textTransform:"uppercase",letterSpacing:.5,marginBottom:5}}>{meal.label}</div>
                    {isEd?(
                      <div><textarea autoFocus value={txt} onChange={e=>setTxt(e.target.value)} rows={2} placeholder={`O que há ao ${meal.label.toLowerCase()}?`} style={{width:"100%",padding:"8px 10px",borderRadius:8,border:`1.5px solid ${C.primary}`,background:C.fill,fontSize:14,outline:"none",resize:"none",fontFamily:"inherit",boxSizing:"border-box",color:C.label}}/>
                      <div style={{display:"flex",gap:8,marginTop:8}}><Btn small label="Guardar" onClick={()=>saveMeal(date,meal.key,txt)} full={false}/><Btn small label="Cancelar" variant="secondary" onClick={()=>setEditing(null)} full={false}/></div></div>
                    ):(
                      <div onClick={()=>{setTxt(val);setEditing({date,key:meal.key});}} style={{fontSize:14,color:val?C.label:C.tertiary,cursor:"pointer",lineHeight:1.5,minHeight:20}}>{val||`Adicionar ${meal.label.toLowerCase()}...`}</div>
                    )}
                  </div>
                </div>
                {i<MEAL_TYPES.length-1&&<Sep left={50}/>}
              </div>;
            })}
          </div>}
        </Card>;
      })}
    </div>
  );
}

// ─── TAB: DESPESAS ───────────────────────────────────────────────────────────
function DespesasTab({tripId,expsList,people}){
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({description:"",amount:"",paidBy:"",category:"supermercado",splitWith:[]});
  const [busy,setBusy]=useState(false);
  const openAdd=()=>{setForm({description:"",amount:"",paidBy:people[0]?.id||"",category:"supermercado",splitWith:people.map(p=>p.id)});setModal(true);};
  const save=async()=>{
    if(!form.description||!form.amount||!form.paidBy||!form.splitWith.length)return;
    setBusy(true);
    await db.collection("trips").doc(tripId).collection("expenses").add({...form,amount:parseFloat(form.amount),date:today(),createdAt:ts()});
    setBusy(false);setModal(false);
  };
  const del=async id=>await db.collection("trips").doc(tripId).collection("expenses").doc(id).delete();
  const toggleP=id=>setForm(f=>({...f,splitWith:f.splitWith.includes(id)?f.splitWith.filter(x=>x!==id):[...f.splitWith,id]}));
  const total=expsList.reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const byCat=EXPENSE_CATS.map(c=>({...c,t:expsList.filter(e=>e.category===c.id).reduce((s,e)=>s+parseFloat(e.amount||0),0)})).filter(c=>c.t>0);
  return(
    <div style={{padding:"16px 16px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
        <div><div style={{fontSize:30,fontWeight:800,color:C.label}}>{currency(total)}</div><div style={{fontSize:13,color:C.secondary,marginTop:2}}>{expsList.length} despesa{expsList.length!==1?"s":""} registada{expsList.length!==1?"s":""}</div></div>
        {people.length>0&&<button onClick={openAdd} style={{background:C.primary,color:"white",border:"none",borderRadius:50,width:34,height:34,fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>}
      </div>
      {byCat.length>0&&<><SecHeader title="Por categoria"/><div style={{display:"flex",gap:8,marginBottom:20,overflowX:"auto",paddingBottom:4}}>{byCat.map(c=><div key={c.id} style={{background:C.card,borderRadius:12,padding:"12px 14px",minWidth:90,flexShrink:0}}><div style={{fontSize:22}}>{c.emoji}</div><div style={{fontSize:13,fontWeight:700,color:C.label,marginTop:5}}>{currency(c.t)}</div><div style={{fontSize:11,color:C.secondary,marginTop:1}}>{c.label}</div></div>)}</div></>}
      {expsList.length>0?(<><SecHeader title="Histórico"/>
        <Card style={{marginBottom:20}}>{[...expsList].reverse().map((e,i,arr)=>{
          const payer=people.find(p=>p.id===e.paidBy);const cat=EXPENSE_CATS.find(c=>c.id===e.category);
          const share=e.splitWith?.length?parseFloat(e.amount)/e.splitWith.length:0;
          return<div key={e.id}><div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px"}}>
            <div style={{width:42,height:42,borderRadius:11,background:C.fill,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{cat?.emoji||"💳"}</div>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:15,fontWeight:600,color:C.label,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.description}</div><div style={{fontSize:12,color:C.secondary,marginTop:2}}>Pago por <span style={{fontWeight:600}}>{payer?.name||"?"}</span> · {e.splitWith?.length||0} pessoas · {currency(share)}/pessoa</div></div>
            <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:15,fontWeight:700,color:C.label}}>{currency(parseFloat(e.amount))}</div><button onClick={()=>del(e.id)} style={{background:"none",border:"none",color:C.danger,fontSize:11,cursor:"pointer",padding:0,marginTop:2,fontFamily:"inherit"}}>remover</button></div>
          </div>{i<arr.length-1&&<Sep left={70}/>}</div>;
        })}</Card>
      </>):<Empty emoji="💶" title="Sem despesas ainda" subtitle={people.length===0?"Adiciona pessoas primeiro":"Regista a primeira despesa"}/>}
      {modal&&<Modal title="Nova Despesa" onClose={()=>setModal(false)}>
        <Input label="Descrição" value={form.description} onChange={v=>setForm(f=>({...f,description:v}))} placeholder="Supermercado, restaurante..."/>
        <Input label="Valor (€)" type="number" value={form.amount} onChange={v=>setForm(f=>({...f,amount:v}))} placeholder="0.00"/>
        <div style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:500,color:C.secondary,marginBottom:8}}>Categoria</div><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{EXPENSE_CATS.map(c=><button key={c.id} onClick={()=>setForm(f=>({...f,category:c.id}))} style={{padding:"6px 12px",borderRadius:100,border:`1px solid ${form.category===c.id?C.primary:C.separator}`,background:form.category===c.id?C.primaryBg:"transparent",color:form.category===c.id?C.primary:C.label,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{c.emoji} {c.label}</button>)}</div></div>
        <div style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:500,color:C.secondary,marginBottom:8}}>Quem pagou?</div><div style={{display:"flex",flexDirection:"column",gap:7}}>{people.map(p=><div key={p.id} onClick={()=>setForm(f=>({...f,paidBy:p.id}))} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,cursor:"pointer",border:`1.5px solid ${form.paidBy===p.id?C.primary:C.separator}`,background:form.paidBy===p.id?C.primaryBg:"transparent"}}><Avatar name={p.name} id={p.id} size={28}/><span style={{flex:1,fontSize:14,color:form.paidBy===p.id?C.primary:C.label,fontWeight:form.paidBy===p.id?700:400}}>{p.name}</span>{form.paidBy===p.id&&<span style={{fontSize:12,color:C.primary}}>✓</span>}</div>)}</div></div>
        <div style={{marginBottom:22}}><div style={{fontSize:13,fontWeight:500,color:C.secondary,marginBottom:8}}>Dividir entre ({form.splitWith.length}/{people.length})</div><div style={{display:"flex",flexDirection:"column",gap:7}}>{people.map(p=>{const sel=form.splitWith.includes(p.id);const share=form.amount&&form.splitWith.length>0?parseFloat(form.amount)/form.splitWith.length:0;return<div key={p.id} onClick={()=>toggleP(p.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,cursor:"pointer",border:`1.5px solid ${sel?C.success:C.separator}`,background:sel?C.successBg:"transparent"}}><Avatar name={p.name} id={p.id} size={28}/><span style={{flex:1,fontSize:14,color:C.label}}>{p.name}</span>{sel&&form.amount&&<span style={{fontSize:13,fontWeight:600,color:C.success}}>{currency(share)}</span>}<div style={{width:20,height:20,borderRadius:"50%",border:`1.5px solid ${sel?C.success:C.separator}`,background:sel?C.success:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{sel&&<span style={{color:"white",fontSize:12,fontWeight:700}}>✓</span>}</div></div>;}}</div></div>
        <Btn label="Adicionar Despesa" onClick={save} loading={busy} disabled={!form.description||!form.amount||!form.paidBy||!form.splitWith.length}/>
      </Modal>}
    </div>
  );
}

// ─── TAB: DIVISÃO ─────────────────────────────────────────────────────────────
function DivisaoTab({expsList,people}){
  const {txns,bal}=useMemo(()=>simplify(expsList,people),[expsList,people]);
  if(!people.length)return<Empty emoji="⚖️" title="Adiciona pessoas primeiro" subtitle="No separador Pessoas"/>;
  const totalSpent=expsList.reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const maxAbs=Math.max(...Object.values(bal).map(v=>Math.abs(v)),0.01);
  return(
    <div style={{padding:"16px 16px 0"}}>
      <div style={{marginBottom:22}}><div style={{fontSize:22,fontWeight:800}}>Divisão de Custos</div><div style={{fontSize:13,color:C.secondary,marginTop:2}}>Simplificado · {txns.length} transferência{txns.length!==1?"s":""} necessária{txns.length!==1?"s":""}</div></div>
      <SecHeader title="Saldo por Pessoa"/>
      <Card style={{marginBottom:22}}>{people.map((p,i)=>{
        const b=bal[p.id]||0;const pos=b>=0;const pct=(Math.abs(b)/maxAbs)*100;
        return<div key={p.id}><div style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px"}}>
          <Avatar name={p.name} id={p.id}/>
          <div style={{flex:1}}><div style={{fontSize:15,fontWeight:600,color:C.label}}>{p.name}</div><div style={{marginTop:7,height:5,background:C.fill,borderRadius:100,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:Math.abs(b)<0.01?C.fill:pos?C.success:C.danger,borderRadius:100,transition:"width .4s"}}/></div><div style={{fontSize:11,color:C.secondary,marginTop:3}}>{Math.abs(b)<0.01?"Contas certas":pos?`A receber ${currency(b)}`:`A pagar ${currency(Math.abs(b))}`}</div></div>
          <div style={{fontSize:16,fontWeight:800,color:Math.abs(b)<0.01?C.tertiary:pos?C.success:C.danger,minWidth:72,textAlign:"right"}}>{Math.abs(b)<0.01?"—":(pos?"+":"")+currency(b)}</div>
        </div>{i<people.length-1&&<Sep left={64}/>}</div>;
      })}</Card>
      <SecHeader title={`Transferências (${txns.length})`}/>
      {txns.length===0?(
        <Card style={{padding:"24px 16px",textAlign:"center",marginBottom:22}}><div style={{fontSize:36,marginBottom:8}}>🎉</div><div style={{fontSize:16,fontWeight:700,color:C.label}}>Tudo resolvido!</div><div style={{fontSize:13,color:C.secondary,marginTop:4}}>Nenhuma dívida por liquidar</div></Card>
      ):(
        <Card style={{marginBottom:22}}>{txns.map((t,i)=>{
          const from=people.find(p=>p.id===t.from);const to=people.find(p=>p.id===t.to);
          return<div key={i}><div style={{display:"flex",alignItems:"center",padding:"14px 16px",gap:10}}><Avatar name={from?.name||"?"} id={t.from} size={34}/><div style={{flex:1}}><div style={{fontSize:14,color:C.label,lineHeight:1.4}}><span style={{fontWeight:700}}>{from?.name}</span><span style={{color:C.secondary}}> deve pagar a </span><span style={{fontWeight:700}}>{to?.name}</span></div></div><Avatar name={to?.name||"?"} id={t.to} size={34}/><div style={{fontSize:17,fontWeight:800,color:C.primary,minWidth:72,textAlign:"right"}}>{currency(t.amount)}</div></div>{i<txns.length-1&&<Sep/>}</div>;
        })}</Card>
      )}
      {expsList.length>0&&<><SecHeader title="Resumo Global"/>
        <Card style={{padding:"2px 16px",marginBottom:22}}>{[{l:"Total gasto",v:currency(totalSpent)},{l:"Por pessoa (média)",v:people.length?currency(totalSpent/people.length):"—"},{l:"Despesas",v:expsList.length},{l:"Transferências",v:`${txns.length} pagamento${txns.length!==1?"s":""}`}].map((r,i,arr)=>(
          <div key={r.l}><div style={{display:"flex",justifyContent:"space-between",padding:"13px 0"}}><span style={{fontSize:15,color:C.label}}>{r.l}</span><span style={{fontSize:15,fontWeight:700,color:C.label}}>{r.v}</span></div>{i<arr.length-1&&<Sep/>}</div>
        ))}</Card>
      </>}
    </div>
  );
}

// ─── TAB ICONS ───────────────────────────────────────────────────────────────
const TAB_ICONS={
  viagem:  a=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.primary:C.tertiary} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>,
  pessoas: a=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.primary:C.tertiary} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>,
  menu:    a=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.primary:C.tertiary} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3h18v3H3z"/><path d="M3 9h18v3H3z"/><path d="M3 15h18v3H3z"/><path d="M3 21h18"/></svg>,
  despesas:a=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.primary:C.tertiary} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>,
  divisao: a=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.primary:C.tertiary} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>,
};
const TABS=[{id:"viagem",label:"Viagem"},{id:"pessoas",label:"Pessoas"},{id:"menu",label:"Menu"},{id:"despesas",label:"Despesas"},{id:"divisao",label:"Divisão"}];

// ─── APP ─────────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("loading");
  const [trip,setTripLocal]=useState(null);
  const [people,setPeople]=useState([]);
  const [mealsList,setMeals]=useState([]);
  const [expsList,setExpenses]=useState([]);
  const [tab,setTab]=useState("viagem");
  const tripTimer=useRef(null);
  const unsubs=useRef([]);

  const clearUnsubs=()=>{unsubs.current.forEach(u=>u());unsubs.current=[];};

  useEffect(()=>{
    const saved=localStorage.getItem("ferias-trip-id");
    if(saved)loadTrip(saved);else setScreen("join");
    return()=>clearUnsubs();
  },[]);

  const loadTrip=async(id)=>{
    clearUnsubs();
    const doc=await trips().doc(id).get();
    if(!doc.exists){localStorage.removeItem("ferias-trip-id");setScreen("join");return;}
    setTripLocal({id:doc.id,...doc.data()});

    // Real-time listeners
    unsubs.current.push(
      people(id).orderBy("createdAt").onSnapshot(s=>setPeople(s.docs.map(toDoc)))
    );
    unsubs.current.push(
      meals(id).onSnapshot(s=>setMeals(s.docs.map(d=>({id:d.id,...d.data()}))))
    );
    unsubs.current.push(
      expenses(id).orderBy("createdAt").onSnapshot(s=>setExpenses(s.docs.map(toDoc)))
    );
    setScreen("app");
  };

  const handleJoin=async(code)=>{
    const q=await trips().where("shareCode","==",code).limit(1).get();
    if(q.empty)return false;
    const id=q.docs[0].id;
    localStorage.setItem("ferias-trip-id",id);
    await loadTrip(id);return true;
  };
  const handleCreate=async()=>{
    const ref=await trips().add({name:"As Nossas Férias",shareCode:genCode(),createdAt:ts()});
    localStorage.setItem("ferias-trip-id",ref.id);
    await loadTrip(ref.id);
  };
  const handleLeave=()=>{
    clearUnsubs();localStorage.removeItem("ferias-trip-id");
    setTripLocal(null);setPeople([]);setMeals([]);setExpenses([]);setScreen("join");
  };

  const setTrip=useCallback((updater)=>{
    setTripLocal(prev=>{
      const next=typeof updater==="function"?updater(prev):updater;
      if(tripTimer.current)clearTimeout(tripTimer.current);
      tripTimer.current=setTimeout(()=>{
        trips().doc(next.id).update({
          name:next.name||"",location:next.location||"",
          startDate:next.startDate||"",endDate:next.endDate||"",
          budget:next.budget||"",notes:next.notes||"",
        });
      },700);
      return next;
    });
  },[]);

  if(screen==="loading")return<Spinner/>;
  if(screen==="join")return<JoinScreen onJoin={handleJoin} onCreate={handleCreate}/>;

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI',sans-serif",maxWidth:640,margin:"0 auto",position:"relative",paddingBottom:90}}>
      <div style={{background:"rgba(242,242,247,.88)",backdropFilter:"blur(20px)",borderBottom:`1px solid ${C.separator}`,padding:"48px 20px 12px",position:"sticky",top:0,zIndex:100}}>
        <div style={{fontSize:12,color:C.secondary,fontWeight:500,letterSpacing:.3}}>{trip.location||"Férias em Grupo"}</div>
        <div style={{fontSize:26,fontWeight:800,color:C.label,lineHeight:1.1,marginTop:1}}>{trip.name||"As Nossas Férias"}</div>
      </div>
      <div>
        {tab==="viagem"  &&<ViagemTab   trip={trip} setTrip={setTrip} people={people} expenses={expsList} onLeave={handleLeave}/>}
        {tab==="pessoas" &&<PessoasTab  tripId={trip.id} people={people}/>}
        {tab==="menu"    &&<MenuTab     trip={trip} mealsList={mealsList} people={people}/>}
        {tab==="despesas"&&<DespesasTab tripId={trip.id} expsList={expsList} people={people}/>}
        {tab==="divisao" &&<DivisaoTab  expsList={expsList} people={people}/>}
      </div>
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:640,background:"rgba(242,242,247,.92)",backdropFilter:"blur(20px)",borderTop:`1px solid ${C.separator}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom,0)",zIndex:200}}>
        {TABS.map(t=>{const active=tab===t.id;return(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"9px 0 11px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            {TAB_ICONS[t.id](active)}<span style={{fontSize:10,fontWeight:600,color:active?C.primary:C.tertiary,letterSpacing:.2}}>{t.label}</span>
          </button>
        );})}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
